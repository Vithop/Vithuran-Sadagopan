  <!-- Main V.S text in ink -->
  <text x="64" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="76" fill="#1c1e1d" text-anchor="middle" letter-spacing="-4">VS</text>
